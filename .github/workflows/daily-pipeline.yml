name: Faceless Video Pipeline

on:
  schedule:
    - cron: '45 4 * * *'   # 10:30 AM Nepal Time (Shorts)
    - cron: '15 12 * * *'  # 6:00 PM Nepal Time (Long)
  workflow_dispatch: 

jobs:
  generate-short:
    if: github.event.schedule == '45 4 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Decode Credentials
        env: { YT_TOKEN_B64: "${{ secrets.YOUTUBE_TOKEN_PICKLE }}", YT_CLIENT_B64: "${{ secrets.YOUTUBE_CLIENT_SECRET }}" }
        run: echo "$YT_TOKEN_B64" | base64 -d > token.pickle && echo "$YT_CLIENT_B64" | base64 -d > client_secret.json
      - name: Create .env
        run: echo "${{ secrets.ENV_FILE }}" > .env
      - name: Run Shorts Pipeline
        run: |
          mkdir -p output assets logs
          chmod +x run_pipeline_ci.sh
          ./run_pipeline_ci.sh

  generate-long:
    if: github.event.schedule == '15 12 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Decode Credentials
        env: { YT_TOKEN_B64: "${{ secrets.YOUTUBE_TOKEN_PICKLE }}", YT_CLIENT_B64: "${{ secrets.YOUTUBE_CLIENT_SECRET }}" }
        run: echo "$YT_TOKEN_B64" | base64 -d > token.pickle && echo "$YT_CLIENT_B64" | base64 -d > client_secret.json
      - name: Create .env
        run: echo "${{ secrets.ENV_FILE }}" > .env
      - name: Run Long Video Pipeline
        run: |
          mkdir -p output assets logs
          chmod +x run_pipeline_ci_long.sh
          ./run_pipeline_ci_long.sh
